{% if results %}
  <div class="absolute z-10 w-full mt-1 bg-surface-2 rounded-md shadow-lg border border-strong max-h-60 overflow-auto">
    {% for tv in results %}
      <button type="button"
              class="w-full px-4 py-2 text-left text-sm text-fg hover:bg-surface-1 hover:text-fg"
              onclick="document.getElementById('parent-tv-input').value = '{{ tv.item.title }}'; document.getElementById('parent-tv-id').value = '{{ tv.id }}'; document.getElementById('parent-tv-results').innerHTML = '';">
        {{ tv.item.title }}
      </button>
    {% endfor %}
  </div>
{% elif query %}
  <div class="absolute z-10 w-full mt-1 bg-surface-2 rounded-md shadow-lg border border-strong p-3">
    <p class="text-sm text-fg-muted">No TV shows found matching "{{ query }}". Please try a different search term.</p>
  </div>
{% endif %}
