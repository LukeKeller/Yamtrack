{% load app_tags %}

<div class="shrink-0 bg-surface-1 rounded-lg overflow-hidden shadow-lg group flex flex-col w-44 aspect-2/3 relative">
  <a href="{% url 'person_details' person_id=cast.id name=cast.name|slug %}"
     class="relative w-full flex-1"
     title="View filmography for {{ cast.name }}">
    <img alt="{{ cast.name }}"
         class="lazyload absolute inset-0 w-full h-full bg-surface-2 transition-opacity duration-300 {% if cast.image != IMG_NONE %}object-cover{% endif %}"
         src="{{ IMG_NONE }}"
         data-src="{{ cast.image }}">
    <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-200">
      <div class="p-2.5 bg-accent-strong text-white rounded-full hover:bg-accent-strong hover:scale-110 transition-all duration-200"
           title="View filmography for {{ cast.name }}">
        {% include "app/icons/person.svg" with classes="w-5 h-5" %}
      </div>
    </div>
  </a>

  <a href="https://www.themoviedb.org/person/{{ cast.id }}"
     target="_blank"
     rel="noopener"
     class="absolute top-2 right-2 p-1.5 bg-surface-0/80 text-fg rounded-full hover:bg-accent-strong transition-colors duration-200 opacity-0 group-hover:opacity-100"
     title="Open TMDB page for {{ cast.name }}">
    {% include "app/icons/external-link.svg" with classes="w-3.5 h-3.5" %}
  </a>

  <div class="px-3 py-2 flex flex-col justify-center">
    <div class="text-sm font-semibold text-fg line-clamp-1"
         title="{{ cast.name }}">{{ cast.name }}</div>
    <div class="text-xs text-fg-muted line-clamp-1 mt-0.5"
         title="{{ cast.character }}">{{ cast.character }}</div>
  </div>
</div>
