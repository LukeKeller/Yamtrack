repos:
  - repo: local
    hooks:
      - id: check-migrations
        name: check-migrations
        entry: python src/manage.py makemigrations --check
        language: system
        pass_filenames: false
        always_run: true
      - id: django-upgrade
        name: django-upgrade
        entry: django-upgrade
        language: system
        types: [python]
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: system
        types: [python]
        require_serial: true
      - id: djlint-lint
        name: djlint-lint
        entry: djlint --lint
        language: system
        types: [html]
        require_serial: true
      - id: djlint-reformat
        name: djlint-reformat
        entry: djlint --reformat
        language: system
        types: [html]
        require_serial: true
      - id: check-multiline-django-comments
        name: check-multiline-django-comments
        # Django's `{# … #}` is single-line only; multi-line blocks render as
        # literal text. This guard catches them before commit so we stop
        # shipping leaked comment text to users.
        entry: ./scripts/check-multiline-comments.sh
        language: system
        types: [html]
        require_serial: true
      - id: tailwind-build
        name: tailwind-build
        # Rebuilds src/static/css/main.css from input.css + the template tree.
        # main.css is a checked-in build artifact (the Dockerfile and the
        # YunoHost installer both serve it as-is via collectstatic); this hook
        # makes sure it stays in lockstep with input.css and the class names
        # used in templates. See build-css.sh for details.
        entry: ./build-css.sh
        language: system
        pass_filenames: false
        files: ^src/(static/css/.*\.css|templates/.*\.html|app/config\.py|app/templatetags/.*\.py)$