<!doctype html>
<html lang="en" data-theme="default">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track drawer — Yamtrack (redesign mock)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="_assets/tokens.css">
</head>
<body class="min-h-screen">
  <!-- Faded background -->
  <div class="flex min-h-screen" style="filter: blur(2px) brightness(0.5)">
    <aside class="hidden lg:flex w-[220px] bg-surface-0 border-r-default h-screen"></aside>
    <div class="flex-1">
      <header class="h-14 bg-surface-0 border-b-default"></header>
      <main class="px-8 py-12">
        <div class="h-32 bg-surface-1 rounded-md mb-4"></div>
        <div class="h-96 bg-surface-1 rounded-md"></div>
      </main>
    </div>
  </div>

  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/30 backdrop-blur-sm z-40"></div>

  <!-- Drawer -->
  <div class="fixed top-0 right-0 h-full w-full md:w-[480px] bg-surface-0 border-l border-default z-50 flex flex-col" style="box-shadow: var(--shadow-elev-2)">

    <!-- Drawer header -->
    <div class="flex items-center gap-3 px-5 py-4 border-b-default">
      <div class="w-12 h-16 rounded-sm shrink-0" style="background: linear-gradient(160deg, #f9a8d4 0%, #db2777 60%, #500724 100%);"></div>
      <div class="flex-1 min-w-0">
        <p class="text-[11px] uppercase tracking-wider text-fg-faint">Tracking</p>
        <h2 class="font-semibold truncate">Past Lives</h2>
        <p class="text-xs text-fg-muted truncate">Movie · 2023 · A24</p>
      </div>
      <button class="btn btn-icon btn-ghost" title="Close (Esc)">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto px-5 py-4 space-y-5">

      <!-- Status segmented control -->
      <section>
        <p class="text-[11px] uppercase tracking-wider text-fg-faint mb-2">Status</p>
        <div class="grid grid-cols-5 gap-1 p-1 bg-surface-2 rounded-md">
          <button class="flex flex-col items-center gap-1 py-2 rounded-sm bg-surface-3" title="Completed">
            <span class="status-dot status-dot-completed"></span>
            <span class="text-[11px] font-medium" style="color: var(--status-completed)">Done</span>
          </button>
          <button class="flex flex-col items-center gap-1 py-2 rounded-sm hover:bg-surface-3" title="In progress">
            <span class="status-dot status-dot-in-progress"></span>
            <span class="text-[11px] text-fg-muted">Watching</span>
          </button>
          <button class="flex flex-col items-center gap-1 py-2 rounded-sm hover:bg-surface-3" title="Planning">
            <span class="status-dot status-dot-planning"></span>
            <span class="text-[11px] text-fg-muted">Plan</span>
          </button>
          <button class="flex flex-col items-center gap-1 py-2 rounded-sm hover:bg-surface-3" title="Paused">
            <span class="status-dot status-dot-paused"></span>
            <span class="text-[11px] text-fg-muted">Paused</span>
          </button>
          <button class="flex flex-col items-center gap-1 py-2 rounded-sm hover:bg-surface-3" title="Dropped">
            <span class="status-dot status-dot-dropped"></span>
            <span class="text-[11px] text-fg-muted">Dropped</span>
          </button>
        </div>
      </section>

      <!-- Quick actions (visible when status implies they make sense) -->
      <section>
        <p class="text-[11px] uppercase tracking-wider text-fg-faint mb-2">Quick actions</p>
        <div class="flex flex-wrap gap-2">
          <button class="btn btn-secondary btn-sm">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
            End date · today
          </button>
          <button class="btn btn-secondary btn-sm">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-9-9 9 9 0 0 1 9-9c4 0 7.5 2.5 8.5 6"/></svg>
            Log a rewatch
          </button>
          <button class="btn btn-secondary btn-sm">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            Add to list…
          </button>
        </div>
      </section>

      <!-- Score -->
      <section>
        <div class="flex items-center justify-between mb-2">
          <p class="text-[11px] uppercase tracking-wider text-fg-faint">Your rating</p>
          <span class="text-xs text-fg-muted">9/10 · <span class="font-medium text-accent">4.5★</span></span>
        </div>
        <div class="flex items-center gap-3">
          <div class="stars" style="--star-fill: 100%">
            <span class="star" style="--star-fill: 100%"></span>
            <span class="star" style="--star-fill: 100%; width:24px; height:24px"></span>
            <span class="star" style="--star-fill: 100%; width:24px; height:24px"></span>
            <span class="star" style="--star-fill: 100%; width:24px; height:24px"></span>
            <span class="star" style="--star-fill: 100%; width:24px; height:24px"></span>
            <span class="star" style="--star-fill: 50%; width:24px; height:24px"></span>
          </div>
          <div class="text-xs text-fg-muted">Click stars · click left/right of star for half</div>
        </div>
      </section>

      <!-- Dates -->
      <section>
        <p class="text-[11px] uppercase tracking-wider text-fg-faint mb-2">Dates</p>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-fg-muted mb-1">Started</label>
            <input class="input h-9" type="date" value="2024-05-14">
          </div>
          <div>
            <label class="block text-xs text-fg-muted mb-1">Finished</label>
            <input class="input h-9" type="date" value="2024-05-14">
          </div>
        </div>
      </section>

      <!-- Notes -->
      <section>
        <p class="text-[11px] uppercase tracking-wider text-fg-faint mb-2">Notes</p>
        <textarea class="input h-24 py-2" placeholder="Add a note…">Saw this twice in theaters. The final shot stays with me. — Liz nearly cried in the car after.</textarea>
      </section>

      <!-- Edit details reveal -->
      <section>
        <details>
          <summary class="cursor-pointer text-sm text-accent hover:underline list-none flex items-center gap-1">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
            Advanced
          </summary>
          <div class="mt-3 space-y-3">
            <div>
              <label class="block text-xs text-fg-muted mb-1">Repeats (rewatches)</label>
              <div class="flex items-center gap-1">
                <button class="btn btn-icon btn-sm btn-secondary">-</button>
                <input class="input h-9 w-16 text-center" value="2">
                <button class="btn btn-icon btn-sm btn-secondary">+</button>
                <span class="ml-2 text-xs text-fg-muted">2 logged watches</span>
              </div>
            </div>
            <div>
              <label class="block text-xs text-fg-muted mb-1">Source</label>
              <select class="input h-9">
                <option>TMDB · default</option>
                <option>Manual entry</option>
              </select>
            </div>
          </div>
        </details>
      </section>

    </div>

    <!-- Sticky footer -->
    <div class="px-5 py-4 border-t-default flex items-center justify-between">
      <button class="btn btn-destructive btn-sm">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        Remove
      </button>
      <div class="flex items-center gap-2">
        <button class="btn btn-ghost">Cancel</button>
        <button class="btn btn-primary">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
          Save
          <span class="text-[11px] opacity-70 ml-1"><kbd>⌘↵</kbd></span>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
