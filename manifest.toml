#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "stackwise"
name = "Stackwise"
description.en = "Stackwise — media tracker for movies, TV, anime, manga, games, books and more"
description.fr = "Stackwise — suivi de médias pour films, séries, anime, manga, jeux, livres et plus"

version = "0.25.2~ynh44"

maintainers = ["lukekeller"]

[upstream]
license = "AGPL-3.0-or-later"
code = "https://github.com/LukeKeller/stackwise_ynh"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = true

disk = "100M"
ram.build = "300M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/stackwise"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

    [install.admin]
    type = "user"

    [install.enable_sso]
    type = "boolean"
    default = true
    ask.en = "Enable SSO authentication via Dex (OIDC)?"
    ask.fr = "Activer l'authentification SSO via Dex (OIDC) ?"
    help.en = "If enabled and Dex is installed, users will authenticate via YunoHost SSO. Otherwise, Stackwise uses its own local authentication. Dex must be installed separately: https://apps.yunohost.org/app/dex"
    help.fr = "Si activé et que Dex est installé, les utilisateurs s'authentifieront via le SSO YunoHost. Sinon, Stackwise utilisera son propre système d'authentification locale. Dex doit être installé séparément : https://apps.yunohost.org/app/dex"

[resources]
    # No [resources.sources] block: the application code (src/) is bundled in
    # this repo and copied into place directly by scripts/install and
    # scripts/upgrade. This is a self-contained package, not a wrapper around a
    # remotely-hosted release tarball.

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    # Public sub-paths: external clients authenticate with their own bearer
    # token (the app's per-user API token, or KOReader's kosync x-auth-*
    # headers), not via SSOwat. Without auth_header=false the YunoHost
    # auth_request middleware 302s unauthenticated requests to the SSO login
    # page, ignoring the Authorization header — which broke the
    # Jellyfin/Plex/Emby webhooks, the ListenBrainz scrobble receiver,
    # KOReader progress sync, and the OPDS library feed. Keep this list in
    # sync with the public-regex location in conf/nginx.conf.
    api.url = "/api/scrobble"
    api.additional_urls = ["/webhook", "/api/koreader", "/library/opds"]
    api.allowed = "visitors"
    api.auth_header = false
    api.show_tile = false
    api.protected = true

    [resources.ports]
    main.default = 8096

    [resources.apt]
    packages = "python3, python3-dev, python3-pip, python3-venv, libpq-dev, postgresql, postgresql-contrib, redis-server"

    [resources.database]
    type = "postgresql"
