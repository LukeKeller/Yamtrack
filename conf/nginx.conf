location __PATH__/static/ {
    alias __INSTALL_DIR__/src/staticfiles/;
    expires 30d;
    access_log off;
}

# User-uploaded media (e.g. self-hosted library/epub covers under MEDIA_ROOT).
# Django does not serve MEDIA in production, so nginx serves it directly from
# the data dir. Filenames are UUIDs; served without SSO like /static/.
location __PATH__/media/ {
    alias __DATA_DIR__/media/;
    expires 7d;
    access_log off;
}

# Public endpoints — bypass YunoHost SSO so external clients can reach them
# with their own auth (Authorization header for ListenBrainz, token-in-URL for
# the media-server webhooks, kosync x-auth-* headers for KOReader, OPDS basic
# auth for the library feed). Without this, SSO 302-redirects unauthenticated
# requests to the login page and ignores those headers. Keep this regex in
# sync with api.additional_urls in manifest.toml.
location ~ ^__PATH__(/(webhook|api/scrobble|api/koreader|library/opds)(/.*)?)$ {
    # Snapshot the client Authorization header NOW, in the rewrite phase.
    # YunoHost's SSOWAT runs `access_by_lua` in the later access phase and,
    # with protect_against_basic_auth_spoofing on (the default), calls
    # ngx.req.clear_header("Authorization") on any inbound Basic header —
    # which would otherwise wipe the OPDS catalog's per-user token before it
    # reaches the app (kosync's x-auth-* headers are untouched). `set` runs
    # before that, so $opds_auth preserves the original for proxy_set_header.
    set $opds_auth $http_authorization;
    # Strip __PATH__ via a capture-in-proxy_pass instead of a `rewrite`:
    # a rewrite would mutate $uri, and SSOWAT's allowlist check (at the
    # access phase, after rewrites) would then see the stripped path and
    # 302 to login. Variables in proxy_pass ARE allowed in regex locations
    # and don't touch $uri. $1 is the path without __PATH__ (Django runs
    # with FORCE_SCRIPT_NAME=__PATH__ and resolves on the unprefixed
    # PATH_INFO, exactly like the main `proxy_pass .../;` block below).
    # $is_args$args preserves the query string.
    proxy_pass http://127.0.0.1:__PORT__$1$is_args$args;
    include    proxy_params;
    # Plain `proxy_params` does not forward the Authorization header (the
    # `_with_auth` variant does, but it also injects YNH_USER /
    # X-Forwarded-User which we don't want trusted on a public-by-design
    # endpoint). The OPDS catalog uses HTTP Basic against the per-user API
    # token, so it needs Authorization to pass through. The kosync
    # endpoints use custom x-auth-* headers, forwarded by default — this
    # line is a no-op for them.
    proxy_set_header Authorization $opds_auth;
    proxy_redirect off;
    client_max_body_size 200M;
}

location __PATH__/ {

    proxy_pass http://127.0.0.1:__PORT__/;
    include    proxy_params_with_auth;

    proxy_redirect off;

    client_max_body_size 200M;
}
